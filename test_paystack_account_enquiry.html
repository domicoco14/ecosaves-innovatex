<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paystack Account Resolution Test — EcoSaves</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: #F6F9F9;
      color: #161C20;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 91, 127, 0.08);
      width: 100%;
      max-width: 480px;
      padding: 32px;
      border: 1px solid #E2E7EB;
    }
    .header {
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: #E6F3F7;
      color: #005B7F;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 6px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #161C20;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 14px;
      color: #737980;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #2C3E50;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1.5px solid #E2E7EB;
      background: #F8F9FA;
      font-size: 15px;
      font-weight: 600;
      color: #161C20;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus, select:focus {
      border-color: #005B7F;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(0, 91, 127, 0.1);
    }
    .btn {
      width: 100%;
      height: 52px;
      background: #005B7F;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .btn:hover {
      background: #004663;
    }
    .btn:disabled {
      background: #B0BEC5;
      cursor: not-allowed;
    }
    .result-box {
      margin-top: 24px;
      padding: 20px;
      border-radius: 16px;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .result-box.success {
      background: #E6F5EB;
      border: 1.5px solid #29875A;
      color: #1A5336;
      display: block;
    }
    .result-box.error {
      background: #FEE9E9;
      border: 1.5px solid #D32F2F;
      color: #9A0000;
      display: block;
    }
    .result-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .account-name {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .account-details {
      font-size: 13px;
      opacity: 0.85;
      font-weight: 600;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #FFF;
      animation: spin 0.8s ease-in-out infinite;
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .json-box {
      margin-top: 16px;
      background: #1E293B;
      color: #38BDF8;
      font-family: monospace;
      font-size: 11px;
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <span class="badge">Paystack Sandbox Demo</span>
      <h1>Resolve NUBAN Account</h1>
      <p class="subtitle">Test Paystack's live Account Enquiry feature</p>
    </div>

    <form id="resolveForm">
      <div class="form-group">
        <label for="apiKey">Paystack Secret Key</label>
        <input
          type="password"
          id="apiKey"
          placeholder="sk_test_..."
          required
          autocomplete="off"
        >
      </div>

      <div class="form-group">
        <label for="bankSelect">Select Bank</label>
        <select id="bankSelect" required>
          <option value="">-- Loading Banks... --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="accountNumber">NUBAN Account Number</label>
        <input
          type="text"
          id="accountNumber"
          placeholder="e.g. 0123456789 (10 digits)"
          maxlength="10"
          required
        >
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Verify Account Details</span>
      </button>
    </form>

    <div id="resultBox" class="result-box">
      <div class="result-title" id="resultHeader">VERIFIED ACCOUNT</div>
      <div class="account-name" id="accountNameResult">—</div>
      <div class="account-details" id="accountDetailsResult">—</div>
    </div>

    <pre id="jsonBox" class="json-box"></pre>
  </div>

  <script>
    const POPULAR_BANKS = [
      { name: "Access Bank", code: "044" },
      { name: "Ecobank Nigeria", code: "050" },
      { name: "GTBank (Guaranty Trust)", code: "058" },
      { name: "First Bank of Nigeria", code: "011" },
      { name: "Zenith Bank", code: "057" },
      { name: "Kuda Bank", code: "50211" },
      { name: "OPay", code: "999992" },
      { name: "Palmpay", code: "999991" },
      { name: "United Bank For Africa (UBA)", code: "033" },
      { name: "Stanbic IBTC Bank", code: "221" },
      { name: "Sterling Bank", code: "232" },
      { name: "Wema Bank", code: "035" },
      { name: "FCMB", code: "214" }
    ];

    const bankSelect = document.getElementById('bankSelect');
    const apiKeyInput = document.getElementById('apiKey');
    const accountNumberInput = document.getElementById('accountNumber');
    const resolveForm = document.getElementById('resolveForm');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const resultBox = document.getElementById('resultBox');
    const resultHeader = document.getElementById('resultHeader');
    const accountNameResult = document.getElementById('accountNameResult');
    const accountDetailsResult = document.getElementById('accountDetailsResult');
    const jsonBox = document.getElementById('jsonBox');

    // Populate Popular Banks
    function populateBanks(banks) {
      bankSelect.innerHTML = '<option value="">-- Choose Bank --</option>';
      banks.forEach(bank => {
        const opt = document.createElement('option');
        opt.value = bank.code;
        opt.textContent = `${bank.name} (${bank.code})`;
        bankSelect.appendChild(opt);
      });
    }

    populateBanks(POPULAR_BANKS);

    // Fetch full live bank list if API key is typed
    apiKeyInput.addEventListener('change', async () => {
      const key = apiKeyInput.value.trim();
      if (!key) return;
      try {
        const res = await fetch('https://api.paystack.co/bank', {
          headers: { Authorization: `Bearer ${key}` }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.status && data.data) {
            const liveBanks = data.data.map(b => ({ name: b.name, code: b.code }));
            populateBanks(liveBanks);
          }
        }
      } catch (err) {
        console.warn('Using pre-populated popular banks');
      }
    });

    // Handle NUBAN Resolution
    resolveForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const apiKey = apiKeyInput.value.trim();
      const bankCode = bankSelect.value;
      const accountNumber = accountNumberInput.value.trim();

      if (!apiKey) {
        alert('Please enter your Paystack Secret Key (sk_test_...)');
        return;
      }

      if (accountNumber.length !== 10 || !/^\d+$/.test(accountNumber)) {
        alert('Please enter a valid 10-digit NUBAN account number.');
        return;
      }

      // UI Loading state
      submitBtn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Resolving...';
      resultBox.style.display = 'none';
      jsonBox.style.display = 'none';

      try {
        const response = await fetch(`https://api.paystack.co/bank/resolve?account_number=${accountNumber}&bank_code=${bankCode}`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          }
        });

        const result = await response.json();

        submitBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Verify Account Details';

        if (response.ok && result.status) {
          resultBox.className = 'result-box success';
          resultHeader.textContent = '✓ VERIFIED ACCOUNT';
          accountNameResult.textContent = result.data.account_name;
          accountDetailsResult.textContent = `Account No: ${result.data.account_number} · Bank Code: ${bankCode}`;
          jsonBox.textContent = JSON.stringify(result, null, 2);
          jsonBox.style.display = 'block';
        } else {
          resultBox.className = 'result-box error';
          resultHeader.textContent = '✕ RESOLUTION FAILED';
          accountNameResult.textContent = 'Account Not Found';
          accountDetailsResult.textContent = result.message || 'Could not verify account details with Paystack.';

          jsonBox.textContent = JSON.stringify(result, null, 2);
          jsonBox.style.display = 'block';
        }
      } catch (error) {
        submitBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Verify Account Details';

        resultBox.className = 'result-box error';
        resultHeader.textContent = '✕ ERROR';
        accountNameResult.textContent = 'Network or API Error';
        accountDetailsResult.textContent = error.message || 'Check internet connection or CORS settings.';
      }
    });
  </script>
</body>
</html>
